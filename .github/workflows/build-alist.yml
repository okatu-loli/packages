name: Build AList package

on:
  push:
    branches:
      - alist-github-actions-build
  workflow_dispatch:

jobs:
  build:
    name: Build package/alist with OpenWrt SDK
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      SDK_URL: https://downloads.openwrt.org/snapshots/targets/x86/64/openwrt-sdk-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst

    steps:
      - name: Checkout packages feed
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates clang curl file flex bison g++ gawk gettext \
            git libncurses-dev libssl-dev make patch perl python3 python3-setuptools \
            rsync unzip wget xz-utils zlib1g-dev zstd

      - name: Build AList
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$GITHUB_WORKSPACE/alist-build.log") 2>&1

          mkdir -p "$RUNNER_TEMP/sdk" "$RUNNER_TEMP/packages-feed"

          curl -L --fail --retry 5 --retry-delay 10 \
            -o "$RUNNER_TEMP/openwrt-sdk-x86-64.tar.zst" \
            "$SDK_URL"

          tar --zstd -xf "$RUNNER_TEMP/openwrt-sdk-x86-64.tar.zst" \
            -C "$RUNNER_TEMP/sdk" --strip-components=1

          rsync -a --delete --exclude .git "$GITHUB_WORKSPACE/" "$RUNNER_TEMP/packages-feed/"

          cd "$RUNNER_TEMP/sdk"
          printf 'src-link packages %s\n' "$RUNNER_TEMP/packages-feed" > feeds.conf.default

          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          make package/alist/{clean,compile} V=s

          find bin/packages -type f -name '*alist*' -print

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alist-build-log
          path: alist-build.log
          if-no-files-found: ignore
